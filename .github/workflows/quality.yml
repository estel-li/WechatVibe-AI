name: Windows quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      # Unit checks run from source; distributable sidecars are prepared by the
      # release builder and are intentionally absent from a clean checkout.
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python-requirements.lock.txt
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r python-requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add clippy --toolchain stable
      - name: Complete regression suite
        run: npm test
      - name: Rust warnings
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Production dependency audit
        run: npm audit --omit=dev --registry=https://registry.npmjs.org --audit-level=high
